<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Checklist — उजणा</title>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --accent:#b4232c;
    --accent-light:#f6e4e1;
    --done-bg:#e8f5e9;
    --done-text:#4a7a4e;
    --text:#2b2320;
    --muted:#8a7e74;
    --border:#e9e1d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:80px;
  }
  header{
    background:var(--accent);
    color:#fff;
    padding:18px 16px 14px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.25rem;
  }
  header .sub{
    font-size:0.82rem;
    opacity:0.9;
  }
  .progress-wrap{
    margin-top:10px;
    background:rgba(255,255,255,0.25);
    border-radius:20px;
    height:10px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:#fff;
    width:0%;
    transition:width .25s ease;
  }
  .progress-text{
    font-size:0.75rem;
    margin-top:6px;
    opacity:0.95;
  }
  .controls{
    display:flex;
    gap:8px;
    padding:12px 16px 0;
    flex-wrap:wrap;
  }
  .controls input[type="text"]{
    flex:1;
    min-width:150px;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    font-size:0.9rem;
  }
  .controls button{
    border:1px solid var(--border);
    background:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:0.82rem;
    cursor:pointer;
    color:var(--text);
  }
  .controls button.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  main{
    padding:12px 16px 40px;
    max-width:720px;
    margin:0 auto;
  }
  .section{
    margin-top:18px;
  }
  .section-title{
    font-size:0.95rem;
    font-weight:700;
    color:var(--accent);
    margin:0 0 8px 2px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title .count{
    font-size:0.75rem;
    font-weight:500;
    color:var(--muted);
  }
  .card{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    transition:background .15s;
  }
  .item:last-child{border-bottom:none;}
  .item:active{background:#f3efe9;}
  .item.done{
    background:var(--done-bg);
  }
  .checkbox{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid var(--accent);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:#fff;
  }
  .item.done .checkbox{
    background:var(--done-text);
    border-color:var(--done-text);
  }
  .item-name{
    flex:1;
    font-size:0.95rem;
  }
  .item.done .item-name{
    text-decoration:line-through;
    color:var(--done-text);
  }
  .item-qty{
    font-size:0.82rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .item.done .item-qty{
    color:var(--done-text);
  }
  .hidden{display:none !important;}
  .empty-msg{
    text-align:center;
    color:var(--muted);
    padding:30px 10px;
    font-size:0.9rem;
  }
  footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    border-top:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.82rem;
    color:var(--muted);
  }
  footer button{
    background:none;
    border:none;
    color:var(--accent);
    font-size:0.82rem;
    cursor:pointer;
    font-weight:600;
  }
</style>
</head>
<body>

<header>
  <h1>🛒 Shopping Checklist</h1>
  <div class="sub">उजणा — कार्यक्रम दिनांक 24/11/26</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-text" id="progressText">0 / 0 bought</div>
</header>

<div class="controls">
  <input type="text" id="searchBox" placeholder="Search item...">
  <button id="filterAll" class="active">All</button>
  <button id="filterPending">Pending</button>
  <button id="filterDone">Bought</button>
</div>

<main id="main"></main>

<footer>
  <span id="footerCount"></span>
  <button id="resetBtn">Reset all</button>
</footer>

<script>
// Data extracted from the two list photos:
// 1) किराणे का सामान / सब्जी व फल / हलवाई का सामान (equipment & counts) — general household/event supplies
// 2) श्री बालाजी मिष्ठान भण्डार order form — halwai/mishtan ingredients for the event

  {

    ]
  },
  {
    category: "हलवाई का सामान — उपकरण (Halwai Equipment)",
    items: [
      ["घी कड़ाई", "2"],

  },
  {

      ["लाल मिर्च", "3 Kg"],
      ["टमाटर सॉस", "2 Kg"],

      ["लहसुन", "3 Kg"],

      ["एमडीएच गरम मसाला", "200 gm"],
      ["चना मसाला", "100 gm"],
      ["किचन किंग", "300 gm"],
      ["चंकी चाट मसाला", "300 gm"],
      ["देशी घी सरस", "10+40 Kg"],
      ["रिफाइंड तेल", "6 pipe"],
      ["मगज का बीज", "1 Kg"],
      ["काली मिर्च", "100 gm"],
      ["नटराज चाकू", "1"],
      ["अजवायन", "400 gm"],
      ["राई", "150 gm"],
      ["केसरिया रंग बुश", "50 gm"],
      ["ऑरेंज रेड रंग", "50 gm"],
      ["पनी", "20x20"],
      ["मूंग दाल", "5 Kg"],
      ["चना दाल मिक्स", "13 Kg"],
      ["लाडु का बेसन", "15 Kg"],
      ["दिलखसार का बेसन", "3 Kg"],
    ]
  },
];
const STORAGE_KEY = "shopping_checklist_state_v1";

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

let state = loadState();
let filter = "all"; // all | pending | done
let searchTerm = "";

function keyFor(catIdx, itemIdx){ return catIdx + "_" + itemIdx; }

function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  let totalCount = 0, doneCount = 0;

  data.forEach((section, catIdx) => {
    const visibleItems = section.items
      .map((item, itemIdx) => ({item, itemIdx}))
      .filter(({item}) => item[0].toLowerCase().includes(searchTerm.toLowerCase()))
      .filter(({itemIdx}) => {
        const isDone = !!state[keyFor(catIdx, itemIdx)];
        if(filter === "pending") return !isDone;
        if(filter === "done") return isDone;
        return true;
      });

    section.items.forEach((item, itemIdx) => {
      totalCount++;
      if(state[keyFor(catIdx, itemIdx)]) doneCount++;
    });

    if(visibleItems.length === 0) return;

    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";

    const doneInSection = section.items.filter((item, itemIdx) => state[keyFor(catIdx, itemIdx)]).length;

    sectionDiv.innerHTML = `
      <div class="section-title">
        <span>${section.category}</span>
        <span class="count">${doneInSection}/${section.items.length}</span>
      </div>
      <div class="card" id="card_${catIdx}"></div>
    `;
    main.appendChild(sectionDiv);

    const card = sectionDiv.querySelector(".card");
    visibleItems.forEach(({item, itemIdx}) => {
      const [name, qty] = item;
      const isDone = !!state[keyFor(catIdx, itemIdx)];
      const row = document.createElement("div");
      row.className = "item" + (isDone ? " done" : "");
      row.innerHTML = `
        <div class="checkbox">${isDone ? "✓" : ""}</div>
        <div class="item-name">${name}</div>
        ${qty ? `<div class="item-qty">${qty}</div>` : ""}
      `;
      row.addEventListener("click", () => {
        const k = keyFor(catIdx, itemIdx);
        state[k] = !state[k];
        saveState(state);
        render();
      });
      card.appendChild(row);
    });
  });

  if(main.children.length === 0){
    main.innerHTML = `<div class="empty-msg">No items match.</div>`;
  }

  document.getElementById("progressBar").style.width = totalCount ? (doneCount/totalCount*100)+"%" : "0%";
  document.getElementById("progressText").textContent = `${doneCount} / ${totalCount} bought`;
  document.getElementById("footerCount").textContent = `${totalCount - doneCount} items pending`;
}

document.getElementById("searchBox").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  render();
});

function setFilter(f){
  filter = f;
  document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
  document.getElementById(
    f === "all" ? "filterAll" : f === "pending" ? "filterPending" : "filterDone"
  ).classList.add("active");
  render();
}
document.getElementById("filterAll").addEventListener("click", () => setFilter("all"));
document.getElementById("filterPending").addEventListener("click", () => setFilter("pending"));
document.getElementById("filterDone").addEventListener("click", () => setFilter("done"));

document.getElementById("resetBtn").addEventListener("click", () => {
  if(confirm("Reset all items to not bought?")){
    state = {};
    saveState(state);
    render();
  }
});

render();
</script>
</body>
</html>
